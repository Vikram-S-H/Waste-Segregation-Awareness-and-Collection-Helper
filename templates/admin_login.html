
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Waste Helper</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f8f3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000020;
        }

        h2 {
            text-align: center;
            color: #176b3a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #176b3a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #104c2b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #176b3a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Waste Segregation Awareness and Collection Helper
        </p>

        <form action="/admin-login" method="POST">

            <label for="username">Username</label>
            <input type="text" id="username"
                   name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   name="password" required>

            <button type="submit">Login</button>

        </form>

        <a href="/" class="back-link">Back to Home</a>

    </div>

</body>
</html>
